kind: Deployment
apiVersion: apps/v1
metadata:
  name: deepexi-reranker-dgi-dev
  namespace: ai-model
  uid: 31da72b9-56bf-48e6-9768-f79e40223644
  resourceVersion: '313701484'
  generation: 7
  creationTimestamp: '2025-11-28T05:31:11Z'
  labels:
    app.kubernetes.io/instance: deepexi-reranker-dgi-dev
    drun/model.name: deepexi-reranker-dgi-dev
    drun/worksapce.id: '4'
  annotations:
    deployment.kubernetes.io/revision: '6'
    kpanda.io/alias-name: 重排模型dev环境
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: deepexi-reranker-dgi-dev
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: deepexi-reranker-dgi-dev
      annotations:
        datakit/prom.instances: |
          [[inputs.prom]]
            urls   = ["http://$IP:9073/metrics"]  # 应用的prometheus采集地址
            source = "deepexi-reranker-dgi-dev"  # 应用的名称可以写服务的名字或容器名字理解成一个label
            measurement_name = "deexi-rerank-gpu"  # 测量名称可以写一个有意义的名称，方便后续查询,指标集合理解成一个指标集合/表 ,会出现在 指标管理=理解成新建一张物理表
            interval = "30s"  # 采集间隔
            [inputs.prom.tags]
              namespace = "$NAMESPACE" #空间变量
              pod_name  = "$PODNAME"   #空间变量
              node_name = "$NODENAME"  # 空间变量
              guance_system = "AIGC" # 按实际观察云工作空间配置
              guance_env = "DEV" # 按实际观察云工作空间配置 生产用 prod
    spec:
      volumes:
        - name: rerank-data
          persistentVolumeClaim:
            claimName: rerank-data-pvc
      initContainers:
        - name: download-model
          image: artifactory.anta.com/docker-virtual/library/busybox:1.35
          command:
            - /bin/sh
            - '-c'
            - |
              if [ "$SKIP_MODEL_DOWNLOAD" = "true" ]; then
                echo "跳过模型下载"
                exit 0
              fi
              if [ ! -d "/data/models" ];then
                  echo "/data/models权重目录不存在，创建中"
                  mkdir -p /data/models
              fi
              # 检查模型目录是否已存在
              if [ -d "/data/models/bge-reranker-v2-m3" ]; then
                echo "模型目录已存在，跳过下载"
                exit 0
              fi

              # 检查tar包是否已存在
              if [ -f "/data/models/bge-reranker-v2-m3.tar" ]; then
                echo "tar包已存在，跳过下载"
              else
                echo "开始下载模型包..."
                # 直接使用wget下载模型包
                wget -O /data/models/bge-reranker-v2-m3.tar http://10.232.148.22:5156/bge-reranker-v2-m3.tar
                if [ $? -ne 0 ]; then
                  echo "下载失败"
                  exit 1
                fi
                echo "下载完成"
              fi

              # 解压模型包
              echo "开始解压模型包..."
              cd /data/models
              tar -xf bge-reranker-v2-m3.tar
              if [ $? -eq 0 ]; then
                echo "解压完成,清理压缩包"
                # 清理tar包
                rm -f bge-reranker-v2-m3.tar
              else
                echo "解压失败"
                exit 1
              fi
          env:
            - name: SKIP_MODEL_DOWNLOAD
              value: 'true'
          resources: {}
          volumeMounts:
            - name: rerank-data
              mountPath: /data
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      containers:
        - name: deepexi-reranker-dgi-dev
          image: artifactory.anta.com/deepexi/model/deploy-dgi:v2.0_cuda12.1
          args:
            - '--model'
            - /data/models/bge-reranker-v2-m3
            - '--served-model-name'
            - reranker
            - '--host'
            - 0.0.0.0
            - '--port'
            - '9073'
            - '--gpu-memory-utilization'
            - '0.8'
          ports:
            - containerPort: 9073
              protocol: TCP
          env:
            - name: MODEL
              value: reranker
            - name: RERANK_MODEL_NAME_OR_PATH
              value: /data/models/bge-reranker-v2-m3
            - name: GPU_IDS
              value: cuda:0
          resources:
            limits:
              cpu: '2'
              memory: 16Gi
              nvidia.com/gpucores: '10'
              nvidia.com/gpumem: 4k
              nvidia.com/vgpu: '1'
            requests:
              cpu: '1'
              memory: 4Gi
          volumeMounts:
            - name: rerank-data
              mountPath: /data
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
status:
  observedGeneration: 7
  conditions:
    - type: Available
      status: 'True'
      lastUpdateTime: '2025-11-28T05:31:18Z'
      lastTransitionTime: '2025-11-28T05:31:18Z'
      reason: MinimumReplicasAvailable
      message: Deployment has minimum availability.
    - type: Progressing
      status: 'True'
      lastUpdateTime: '2026-01-20T16:32:46Z'
      lastTransitionTime: '2025-11-28T05:31:11Z'
      reason: NewReplicaSetAvailable
      message: >-
        ReplicaSet "deepexi-reranker-dgi-dev-5d9686fc69" has successfully
        progressed.
